services:
  mongodb:
    image: mongo:7.0
    container_name: transitflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: transitflow
    volumes:
      - transitflow_mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  transitflow_mongodb:
